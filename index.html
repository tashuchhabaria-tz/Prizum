<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory — Manufacturing ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================= TOKENS ============================= */
:root{
  --ink:#12151C;
  --ink-2:#454B57;
  --ink-3:#767F8D;
  --ink-4:#A2A9B4;
  --border:#E4E7EC;
  --border-strong:#D3D8E0;
  --surface:#FFFFFF;
  --canvas:#F4F5F7;
  --canvas-sunk:#ECEEF1;
  --rail-bg:#12151B;
  --rail-icon:#8890A0;
  --rail-icon-active:#F5F6F8;
  --rail-border:#23262E;

  --primary:#1E4FD9;
  --primary-600:#173FB0;
  --primary-50:#EAF0FE;
  --primary-100:#D7E3FD;

  --success:#15803D;
  --success-soft:#E7F6EC;
  --warning:#B45309;
  --warning-soft:#FDF1DC;
  --danger:#C22A2A;
  --danger-soft:#FBEAEA;
  --danger-strong:#7A1414;
  --danger-strong-soft:#F3DEDE;
  --info:#0E7490;
  --info-soft:#E1F3F6;
  --purple:#6D28D9;
  --purple-soft:#EFE9FC;

  --stock-avail:#16A34A;
  --stock-reserved:#D97706;
  --stock-transit:#2563EB;

  --radius-sm:6px;
  --radius:8px;
  --radius-lg:12px;
  --shadow-sm:0 1px 2px rgba(18,21,28,.06);
  --shadow-md:0 4px 12px rgba(18,21,28,.08), 0 1px 2px rgba(18,21,28,.06);
  --shadow-lg:0 12px 32px rgba(18,21,28,.14), 0 2px 6px rgba(18,21,28,.08);
  --mono: 'JetBrains Mono', ui-monospace, monospace;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  color:var(--ink);
  background:var(--canvas);
  font-size:13.5px;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;}
input,select{font-family:inherit;}
::selection{background:var(--primary-100);}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;}
svg{display:block;}
a{color:inherit;}

/* focus visibility */
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--primary); outline-offset:1px;
}

/* ============================= APP SHELL ============================= */
.app{display:flex; height:100vh; width:100%; overflow:hidden;}

.rail{
  width:60px; flex:0 0 60px; background:var(--rail-bg);
  display:flex; flex-direction:column; align-items:center;
  padding:16px 0; gap:4px;
}
.rail-logo{
  width:32px; height:32px; border-radius:8px; background:linear-gradient(135deg,var(--primary),#4B7BFF);
  display:flex; align-items:center; justify-content:center; margin-bottom:20px; flex:0 0 auto;
}
.rail-item{
  width:40px; height:40px; border-radius:9px; display:flex; align-items:center; justify-content:center;
  color:var(--rail-icon); cursor:pointer; position:relative; border:none; background:transparent;
}
.rail-item:hover{background:#1F232B; color:#C6CBD6;}
.rail-item.active{background:var(--primary); color:var(--rail-icon-active);}
.rail-item.active::before{
  content:''; position:absolute; left:-16px; top:50%; transform:translateY(-50%);
  width:3px; height:18px; border-radius:2px; background:var(--primary);
}
.rail-spacer{flex:1;}
.rail-avatar{
  width:32px;height:32px;border-radius:50%; background:#3A4152; color:#E4E7F0;
  display:flex;align-items:center;justify-content:center; font-size:12px; font-weight:700; margin-top:4px;
}

.main{flex:1; display:flex; flex-direction:column; min-width:0; height:100vh;}

.topbar{
  height:52px; flex:0 0 52px; background:var(--surface); border-bottom:1px solid var(--border);
  display:flex; align-items:center; padding:0 20px; gap:10px; justify-content:space-between;
}
.crumbs{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-3); font-weight:500;}
.crumbs b{color:var(--ink); font-weight:600;}
.topbar-right{display:flex; align-items:center; gap:6px;}
.icon-btn{
  width:32px;height:32px;border-radius:7px; border:none; background:transparent; color:var(--ink-3);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.icon-btn:hover{background:var(--canvas-sunk); color:var(--ink);}
.icon-btn.bordered{border:1px solid var(--border-strong); border-radius:7px; width:32px; height:32px;}

.col-picker-wrap{position:relative;}
.col-picker-menu{
  position:absolute; top:38px; right:0; z-index:40; background:#fff; border:1px solid var(--border); border-radius:10px;
  box-shadow:var(--shadow-lg); padding:8px; min-width:220px; max-height:340px; overflow-y:auto;
}
.col-picker-menu .cp-title{
  font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-3); padding:4px 8px 8px;
}
.col-picker-menu label{
  display:flex; align-items:center; gap:9px; padding:7px 8px; border-radius:6px; font-size:12.5px; font-weight:500;
  color:var(--ink); cursor:pointer;
}
.col-picker-menu label:hover{background:var(--canvas-sunk);}
.col-picker-menu input[type="checkbox"]{
  width:15px; height:15px; accent-color:var(--primary); cursor:pointer; flex:0 0 auto;
}
.col-picker-menu label.disabled{color:var(--ink-4); cursor:not-allowed;}
.col-picker-menu label.disabled input{cursor:not-allowed;}
.col-picker-menu hr{border:none; border-top:1px solid var(--border); margin:6px 0;}
.col-picker-menu .cp-reset{
  width:100%; text-align:left; background:none; border:none; padding:7px 8px; border-radius:6px; font-size:12px;
  font-weight:600; color:var(--primary); cursor:pointer;
}
.col-picker-menu .cp-reset:hover{background:var(--primary-50);}

.content{flex:1; overflow-y:auto; padding:22px 26px 40px; }

.page-head{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:18px; gap:20px; flex-wrap:wrap;}
.page-head h1{margin:0 0 4px; font-size:21px; font-weight:700; letter-spacing:-0.01em;}
.page-head p{margin:0; color:var(--ink-3); font-size:13px;}

/* ============================= VIEW SWITCH ============================= */
.view-switch{
  display:inline-flex; background:var(--canvas-sunk); padding:3px; border-radius:9px; gap:2px; flex:0 0 auto;
}
.view-switch button{
  border:none; background:transparent; width:32px; height:32px; border-radius:7px; font-size:13px; font-weight:600;
  color:var(--ink-3); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .12s, color .12s;
}
.view-switch button.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-sm);}
.view-switch button:hover:not(.active){color:var(--ink);}

/* ============================= TABS ============================= */
.tabs{display:flex; gap:22px; border-bottom:1px solid var(--border); margin-bottom:16px;}
.tab-btn{
  border:none; background:transparent; padding:10px 2px 11px; font-size:13.5px; font-weight:600; color:var(--ink-3);
  cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; display:flex; align-items:center; gap:7px;
}
.tab-btn .count{
  background:var(--canvas-sunk); color:var(--ink-3); font-size:11px; font-weight:700; padding:1px 6px; border-radius:20px;
}
.tab-btn.active{color:var(--ink); border-bottom-color:var(--primary);}
.tab-btn.active .count{background:var(--primary-50); color:var(--primary);}

/* ============================= TOOLBAR ============================= */
.toolbar{display:flex; align-items:center; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
.search-box{
  position:relative; flex:0 0 auto;
}
.search-box input{
  width:240px; height:32px; border-radius:7px; border:1px solid var(--border-strong); background:var(--surface);
  padding:0 10px 0 32px; font-size:13px; color:var(--ink);
}
.search-box input::placeholder{color:var(--ink-4);}
.search-box svg{position:absolute; left:9px; top:8px; color:var(--ink-4);}

.select-wrap{position:relative;}
.select-wrap svg.chev{position:absolute; right:8px; top:9px; pointer-events:none; color:var(--ink-3);}
select.ctrl{
  height:32px; border-radius:7px; border:1px solid var(--border-strong); background:var(--surface); color:var(--ink);
  padding:0 26px 0 10px; font-size:12.5px; font-weight:500; appearance:none; cursor:pointer; min-width:118px;
}
select.ctrl:hover{border-color:var(--ink-4);}

.filter-label{
  display:flex; align-items:center; gap:5px; font-size:12px; font-weight:600; color:var(--ink-3); padding-right:2px;
}

.toolbar-spacer{flex:1;}

.btn{
  height:32px; border-radius:7px; border:1px solid var(--border-strong); background:var(--surface); color:var(--ink);
  padding:0 12px; font-size:12.5px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px;
}
.btn:hover{background:var(--canvas-sunk);}
.btn.primary{background:var(--primary); border-color:var(--primary); color:#fff;}
.btn.primary:hover{background:var(--primary-600);}
.btn.ghost{border-color:transparent; background:transparent;}
.btn.ghost:hover{background:var(--canvas-sunk);}
.btn.sm{height:28px; padding:0 9px; font-size:12px;}
.btn.danger-text{color:var(--danger);}
.seg{display:inline-flex; background:var(--canvas-sunk); border-radius:7px; padding:2px; gap:1px;}
.seg button{border:none; background:transparent; padding:5px 11px; border-radius:5px; font-size:12px; font-weight:600; color:var(--ink-3); cursor:pointer;}
.seg button.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-sm);}

/* ============================= BULK BAR ============================= */
.bulk-bar{
  display:none; align-items:center; gap:14px; background:var(--primary); color:#fff; border-radius:8px;
  padding:8px 14px; margin-bottom:12px; font-size:12.5px; font-weight:600;
}
.bulk-bar.show{display:flex;}
.bulk-bar .grow{flex:1;}
.bulk-bar button{
  background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25); color:#fff; height:28px; border-radius:6px;
  padding:0 10px; font-weight:600; font-size:12px; cursor:pointer; display:flex; align-items:center; gap:5px;
}
.bulk-bar button:hover{background:rgba(255,255,255,.24);}
.bulk-bar button.clear{background:transparent; border:none; text-decoration:underline; text-underline-offset:2px;}

/* ============================= TABLE ============================= */
.table-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden;
  box-shadow:var(--shadow-sm);
}
.table-scroll{overflow:auto; max-height:calc(100vh - 330px); min-height:220px;}
table{border-collapse:separate; border-spacing:0; width:100%; table-layout:fixed;}
thead th{
  position:sticky; top:0; z-index:3; background:var(--canvas); text-align:left;
  font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-3); font-weight:700;
  border-bottom:1px solid var(--border); padding:0; height:36px; white-space:nowrap;
}
th .th-inner{display:flex; align-items:center; height:36px; padding:0 10px; gap:5px; cursor:pointer; user-select:none; overflow:hidden;}
th .th-inner:hover{color:var(--ink);}
th .th-inner.no-sort{cursor:default;}
th .th-inner.no-sort:hover{color:var(--ink-3);}
th .sort-ic{opacity:0; color:var(--ink-4); flex:0 0 auto;}
th.sorted .sort-ic{opacity:1; color:var(--primary);}
th .resizer{
  position:absolute; right:0; top:0; width:6px; height:36px; cursor:col-resize; z-index:4;
}
th .resizer:hover{background:var(--primary-100);}
th{position:sticky;}
th{border-right:1px solid transparent;}

td{
  padding:0 10px; height:52px; border-bottom:1px solid var(--border); font-size:13px; color:var(--ink);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:middle;
}
tbody tr{background:var(--surface);}
tbody tr:hover td{background:#FAFBFC;}
tbody tr.selected td{background:var(--primary-50);}
tbody tr:last-child td{border-bottom:none;}

th:first-child .th-inner, td:first-child{padding-left:14px;}
td.sticky-col, th.sticky-col{position:sticky; left:0; z-index:2; background:inherit;}
th.sticky-col{background:var(--canvas); z-index:5;}
tbody tr:hover td.sticky-col{background:#FAFBFC;}
tbody tr.selected td.sticky-col{background:var(--primary-50);}

.checkbox{
  width:16px; height:16px; border-radius:4px; border:1.5px solid var(--border-strong); background:#fff;
  display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex:0 0 auto;
}
.checkbox.checked{background:var(--primary); border-color:var(--primary); color:#fff;}
.checkbox.indeterminate{background:var(--primary); border-color:var(--primary);}
td.icon-cell{padding:0 !important; text-align:center; overflow:visible !important; text-overflow:clip !important;}

.prod-cell{display:flex; align-items:center; gap:10px;}
.prod-thumb{
  width:32px; height:32px; border-radius:7px; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
  color:#fff;
}
.prod-name-wrap{min-width:0;}
.prod-name{font-weight:600; font-size:13px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.prod-sub{font-size:11.5px; color:var(--ink-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; flex:0 1 auto;}
.prod-sub-row{display:flex; align-items:center; gap:6px; min-width:0;}
.track-tag{
  flex:0 0 auto; font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:1.5px 6px;
  border-radius:20px; white-space:nowrap;
}
.track-tag.serialized{background:var(--primary-50); color:var(--primary);}
.track-tag.unserialized{background:var(--canvas-sunk); color:var(--ink-3);}

.stock-cell{display:flex; flex-direction:column; gap:4px; width:100%;}
.stock-num{font-weight:600; font-size:13px;}
.stock-bar{height:6px; border-radius:3px; background:var(--canvas-sunk); overflow:hidden; width:82px; display:flex;}
.stock-bar > span{height:100%; display:block;}

.stock-legend{
  display:flex; align-items:center; gap:14px; margin:-2px 0 12px; padding:7px 12px; background:var(--canvas-sunk);
  border-radius:7px; font-size:11.5px; color:var(--ink-3); width:fit-content;
}
.legend-title{font-weight:700; color:var(--ink-2);}
.legend-item{display:flex; align-items:center; gap:5px; font-weight:600; color:var(--ink-2);}
.legend-dot{width:8px; height:8px; border-radius:50%; flex:0 0 auto;}

/* toggle switch (e.g. In Transit) */
.toggle-switch{display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none;}
.toggle-switch input{display:none;}
.toggle-track{width:34px; height:19px; border-radius:20px; background:var(--border-strong); position:relative; transition:background .15s; flex:0 0 auto;}
.toggle-thumb{position:absolute; top:2px; left:2px; width:15px; height:15px; border-radius:50%; background:#fff; box-shadow:var(--shadow-sm); transition:transform .15s;}
.toggle-switch input:checked + .toggle-track{background:var(--primary);}
.toggle-switch input:checked + .toggle-track .toggle-thumb{transform:translateX(15px);}
.toggle-label{font-size:12.5px; font-weight:600; color:var(--ink-2);}

/* info icon next to price */
.info-ic{color:var(--ink-4); display:inline-flex; vertical-align:middle; cursor:help; margin-left:1px;}
.info-ic:hover{color:var(--primary);}

.video-link{display:inline-flex; align-items:center; gap:5px; color:var(--primary); font-weight:600; font-size:12.5px; text-decoration:none;}
.video-link:hover{text-decoration:underline;}

.desc-clip{display:inline-block; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:middle;}

/* nested breakdown tables (Site level, Serial level) */
.nested-wrap{padding:10px 14px 14px 66px; background:var(--canvas);}
.nested-table{width:100%; border-collapse:separate; border-spacing:0; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; table-layout:auto;}
.site-table, .serial-table{table-layout:fixed;}
.site-table td, .serial-table td, .site-table th, .serial-table th{overflow:hidden; text-overflow:ellipsis;}
.nested-table thead th{
  position:static; background:var(--primary-50); color:var(--primary-600); font-size:10.5px; text-transform:uppercase;
  letter-spacing:.03em; font-weight:700; padding:8px 10px; height:auto; border-bottom:1px solid var(--border); white-space:nowrap;
}
.nested-table tbody td{
  padding:9px 10px; height:auto; font-size:12.5px; border-bottom:1px solid var(--border); white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; max-width:220px;
}
.nested-table tbody tr:last-child td{border-bottom:none;}
.nested-table tbody tr:hover td{background:#FAFBFC;}
.site-table thead th:first-child, .site-table tbody td:first-child{padding-left:12px;}
.serial-wrap{padding:8px 10px 10px 32px; background:var(--canvas-sunk);}
.serial-table{font-size:12px;}
.serial-link{color:var(--primary); font-weight:600; text-decoration:none; font-family:var(--mono); font-size:12px;}
.serial-link:hover{text-decoration:underline;}
.customer-tag{color:var(--primary); font-weight:700; font-size:11.5px;}

/* price breakdown popover (shown on hover of the info icon beside Price) */
.price-tooltip{
  position:fixed; z-index:80; background:var(--surface); border-radius:12px; box-shadow:var(--shadow-lg);
  border:1px solid var(--border); overflow:hidden; width:max-content; max-width:220px; pointer-events:none;
}
.price-tooltip table{width:auto; border-collapse:collapse;}
.price-tooltip thead th{
  position:static; background:var(--canvas-sunk); color:var(--ink-2); text-transform:none; letter-spacing:0;
  font-size:12.5px; font-weight:700; padding:8px 14px; height:auto; border-bottom:none; text-align:left; white-space:nowrap;
}
.price-tooltip tbody td{
  padding:8px 14px; height:auto; font-size:13px; font-weight:500; color:var(--ink); white-space:nowrap;
  border-bottom:1px solid var(--border); overflow:visible;
}
.price-tooltip tbody tr:last-child td{border-bottom:none;}
.price-tooltip tbody td.price-val{font-family:var(--mono); font-weight:600; text-align:right;}

.badge{
  display:inline-flex; align-items:center; gap:5px; padding:3px 9px 3px 7px; border-radius:20px; font-size:11.5px;
  font-weight:700; white-space:nowrap;
}
.badge .dot{width:6px; height:6px; border-radius:50%; flex:0 0 auto;}
.badge.healthy{background:var(--success-soft); color:var(--success);}
.badge.healthy .dot{background:var(--success);}
.badge.low{background:var(--warning-soft); color:var(--warning);}
.badge.low .dot{background:var(--warning);}
.badge.out{background:var(--danger-soft); color:var(--danger);}
.badge.out .dot{background:var(--danger);}
.badge.reserved{background:var(--purple-soft); color:var(--purple);}
.badge.reserved .dot{background:var(--purple);}
.badge.transit{background:var(--info-soft); color:var(--info);}
.badge.transit .dot{background:var(--info);}
.badge.critical{background:var(--danger-soft); color:var(--danger);}
.badge.critical .dot{background:var(--danger);}
.badge.stockout{background:var(--danger-strong-soft); color:var(--danger-strong);}
.badge.stockout .dot{background:var(--danger-strong);}

.row-actions{display:flex; align-items:center; gap:2px;}
.row-actions .icon-btn{width:28px; height:28px; border-radius:6px;}

/* expandable rows (forecast) */
.expand-btn{
  width:22px; height:22px; border-radius:5px; border:none; background:transparent; color:var(--ink-3);
  display:flex; align-items:center; justify-content:center; cursor:pointer; flex:0 0 auto; transition:transform .15s;
}
.expand-btn:hover{background:var(--canvas-sunk);}
.expand-btn.open{transform:rotate(90deg); color:var(--primary);}

.detail-row td{padding:0; height:auto; background:var(--canvas); border-bottom:1px solid var(--border);}
.detail-wrap{padding:18px 20px 22px 46px;}
.detail-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
.detail-panel{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:13px 14px;
}
.detail-panel h4{
  margin:0 0 10px; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-3);
  display:flex; align-items:center; gap:6px; font-weight:700;
}
.detail-panel h4 svg{color:var(--ink-4);}
.mini-table{width:100%; border-collapse:collapse; font-size:12px;}
.mini-table th{position:static; background:none; border:none; text-align:left; color:var(--ink-4); font-weight:600; padding:0 0 5px; height:auto; text-transform:none; letter-spacing:0; font-size:11px;}
.mini-table td{border:none; padding:4px 0; height:auto; font-size:12px; white-space:normal;}
.mini-table tr+tr td{border-top:1px dashed var(--border);}
.kv-row{display:flex; justify-content:space-between; padding:4px 0; font-size:12px; border-bottom:1px dashed var(--border);}
.kv-row:last-child{border-bottom:none;}
.kv-row span:first-child{color:var(--ink-3);}
.kv-row span:last-child{font-weight:600;}
.sparkbar-row{display:flex; align-items:flex-end; gap:4px; height:52px; margin-top:2px;}
.sparkbar-row .bar{flex:1; background:var(--primary-100); border-radius:2px 2px 0 0; position:relative;}
.sparkbar-row .bar span{position:absolute; bottom:-16px; left:0; right:0; text-align:center; font-size:9.5px; color:var(--ink-4);}
.po-item{display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px dashed var(--border); font-size:12px;}
.po-item:last-child{border-bottom:none;}
.po-item .po-id{font-weight:600; font-family:var(--mono);}

/* ============================= PAGINATION ============================= */
.pagination{
  display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-top:1px solid var(--border);
  font-size:12.5px; color:var(--ink-3);
}
.pagination .pg-right{display:flex; align-items:center; gap:14px;}
.pg-btns{display:flex; align-items:center; gap:3px;}
.pg-btns button{
  width:26px; height:26px; border-radius:6px; border:1px solid var(--border-strong); background:#fff; color:var(--ink-2);
  cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.pg-btns button:disabled{opacity:.4; cursor:not-allowed;}
.pg-btns button:hover:not(:disabled){background:var(--canvas-sunk);}
.pg-numbers{display:flex; align-items:center; gap:3px; margin:0 2px;}
.pg-numbers button{
  min-width:26px; height:26px; border-radius:6px; border:1px solid transparent; background:transparent; color:var(--ink-2);
  cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; padding:0 4px;
}
.pg-numbers button:hover{background:var(--canvas-sunk);}
.pg-numbers button.active{background:var(--primary); color:#fff; border-color:var(--primary);}
.pg-numbers span.pg-ellipsis{color:var(--ink-4); font-size:12px; padding:0 2px;}

/* ============================= SUMMARY CARDS ============================= */
.summary-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin-bottom:16px;}
.summary-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:13px 15px;
  box-shadow:var(--shadow-sm);
}
.summary-card .s-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
.summary-card .s-label{font-size:11.5px; color:var(--ink-3); font-weight:600;}
.summary-card .s-icon{width:26px;height:26px;border-radius:7px; display:flex; align-items:center; justify-content:center;}
.summary-card .s-value{font-size:21px; font-weight:800; font-family:var(--mono); letter-spacing:-0.02em;}
.summary-card .s-sub{font-size:11px; color:var(--ink-3); margin-top:3px;}
.summary-card .s-sub.up{color:var(--success);}
.summary-card .s-sub.down{color:var(--danger);}

/* ============================= MENU / POPOVER ============================= */
.row-menu{
  position:fixed; z-index:60; background:#fff; border:1px solid var(--border); border-radius:9px; box-shadow:var(--shadow-lg);
  padding:5px; min-width:172px; overflow:visible;
}
.row-menu button{
  width:100%; text-align:left; background:none; border:none; padding:8px 9px; border-radius:6px; font-size:12.5px;
  font-weight:500; color:var(--ink); display:flex; align-items:center; gap:8px; cursor:pointer;
}
.row-menu button:hover{background:var(--canvas-sunk);}
.row-menu button.danger{color:var(--danger);}
.row-menu hr{border:none; border-top:1px solid var(--border); margin:4px 0;}
.row-menu button.menu-row-item{justify-content:space-between; color:var(--ink-2);}
.row-menu .menu-icon{color:var(--primary); display:inline-flex; flex:0 0 auto;}
.row-menu .has-sub{position:relative;}
.row-menu .has-sub > .submenu{
  display:none; position:absolute; top:-6px; left:100%; margin-left:4px; background:#fff; border:1px solid var(--border);
  border-radius:9px; box-shadow:var(--shadow-lg); padding:5px; min-width:150px; z-index:61;
}
.row-menu .has-sub.flip-left > .submenu{ left:auto; right:100%; margin-left:0; margin-right:4px; }
.row-menu .has-sub:hover > button{background:var(--canvas-sunk);}
.row-menu .has-sub:hover > .submenu{display:block;}

/* ============================= CARD VIEW ============================= */
.card-toolbar{display:flex; align-items:center; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
.cart-btn{
  position:relative; height:32px; padding:0 12px 0 10px; border-radius:7px; border:1px solid var(--border-strong);
  background:#fff; display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:700; cursor:pointer; color:var(--ink);
}
.cart-btn.has-items{border-color:var(--primary); color:var(--primary); background:var(--primary-50);}
.cart-badge{
  background:var(--primary); color:#fff; font-size:10.5px; font-weight:700; border-radius:20px; min-width:16px; height:16px;
  display:flex; align-items:center; justify-content:center; padding:0 4px;
}

.card-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(228px,1fr)); gap:14px;}
.card-grid.compact{grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px;}

.p-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden;
  box-shadow:var(--shadow-sm); display:flex; flex-direction:column; position:relative; transition:box-shadow .15s, transform .1s;
}
.p-card:hover{box-shadow:var(--shadow-md);}
.p-card.selected{outline:2px solid var(--primary); outline-offset:-1px;}
.p-thumb{
  height:118px; display:flex; align-items:center; justify-content:center; position:relative; flex:0 0 auto;
}
.card-grid.compact .p-thumb{height:84px;}
.p-thumb svg{width:38px; height:38px; color:rgba(255,255,255,.92);}
.p-status-dot{
  position:absolute; top:9px; left:9px; padding:3px 8px; border-radius:20px; font-size:10px; font-weight:700;
  background:rgba(255,255,255,.92); display:flex; align-items:center; gap:4px;
}
.p-status-dot .dot{width:6px;height:6px;border-radius:50%;}
.p-select-check{
  position:absolute; top:9px; right:9px; width:22px; height:22px; border-radius:6px; background:rgba(255,255,255,.92);
  border:1.5px solid rgba(255,255,255,.9); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-3);
}
.p-select-check.on{background:var(--primary); border-color:var(--primary); color:#fff;}
.p-body{padding:11px 12px 12px; display:flex; flex-direction:column; gap:6px; flex:1;}
.card-grid.compact .p-body{padding:8px 9px 9px; gap:4px;}
.p-cat{font-size:10.5px; font-weight:700; color:var(--ink-3); text-transform:uppercase; letter-spacing:.03em;}
.p-name{font-size:13.5px; font-weight:700; line-height:1.3; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
.card-grid.compact .p-name{font-size:12.5px; -webkit-line-clamp:1;}
.p-sku{font-size:11px; color:var(--ink-3); font-family:var(--mono);}
.p-meta{display:flex; align-items:center; justify-content:space-between; font-size:11.5px; color:var(--ink-3); margin-top:2px;}
.p-meta .stock-val{font-weight:700; color:var(--ink); font-family:var(--mono);}
.p-foot{display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:8px; gap:8px;}
.p-price{font-size:15px; font-weight:800; font-family:var(--mono);}
.p-add-btn{
  height:30px; border-radius:7px; border:1px solid var(--border-strong); background:#fff; color:var(--ink);
  font-size:11.5px; font-weight:700; cursor:pointer; padding:0 10px; display:flex; align-items:center; gap:5px;
}
.p-add-btn:hover{border-color:var(--primary); color:var(--primary);}
.p-add-btn.added{background:var(--success-soft); border-color:var(--success); color:var(--success);}

.cart-floater{
  position:fixed; bottom:22px; left:50%; transform:translateX(calc(-50% + 30px)); background:var(--ink); color:#fff;
  border-radius:12px; padding:10px 10px 10px 18px; display:flex; align-items:center; gap:16px; box-shadow:var(--shadow-lg);
  z-index:50; opacity:0; pointer-events:none; transition:opacity .18s, transform .18s;
}
.cart-floater.show{opacity:1; pointer-events:auto; transform:translateX(calc(-50% + 30px)) translateY(0);}
.cart-floater .cf-text{font-size:13px; font-weight:600;}
.cart-floater .cf-text b{font-family:var(--mono);}
.cart-floater .cf-actions{display:flex; gap:8px;}
.cart-floater button.primary{background:var(--primary); border:none; color:#fff; height:34px; padding:0 14px; border-radius:8px; font-weight:700; font-size:12.5px; cursor:pointer;}
.cart-floater button.clear{background:transparent; border:none; color:#B7BCC7; height:34px; padding:0 6px; font-weight:600; font-size:12.5px; cursor:pointer;}

.hidden{display:none !important;}
.empty-state{padding:60px 20px; text-align:center; color:var(--ink-3);}
.empty-state svg{margin:0 auto 12px; color:var(--ink-4);}
.empty-state h3{margin:0 0 4px; color:var(--ink); font-size:14px;}
.empty-state p{margin:0; font-size:12.5px;}

.tooltip-note{font-size:11px; color:var(--ink-3);}
</style>
</head>

const CAT_ICON = {
  'Raw Materials': ic.layers, 'Components': ic.bolt, 'Sub-Assemblies': ic.gear,
  'Finished Goods': ic.package, 'Packaging': ic.box, 'Consumables': ic.droplet
};
const CAT_COLOR = {
  'Raw Materials':'#6B7280', 'Components':'#1E4FD9', 'Sub-Assemblies':'#7C3AED',
  'Finished Goods':'#0E7490', 'Packaging':'#B45309', 'Consumables':'#15803D'
};

/* ============================================================
   DATA
============================================================ */
const CATEGORIES = ['Raw Materials','Components','Sub-Assemblies','Finished Goods','Packaging','Consumables'];
const WAREHOUSES = ['Main Warehouse – Detroit','East Distribution Center','West Coast Facility','Overflow Storage B'];
const SITE_CODES = [10,20,30,40,50,60];
const SUPPLIERS = ['Titan Steel Co.','Apex Fasteners','Nova Electronics','Summit Packaging','Global Bearings Inc.','Precision Motors Ltd.'];
const SERIAL_PREFIX = ['L','H','A','E','C','M'];

const NAMES = [
  ['M8 Hex Bolt 40mm','Components'],['Steel Sheet 4×8 Gauge 16','Raw Materials'],
  ['Brushless DC Motor 24V','Components'],['Aluminum Bracket Type-A','Sub-Assemblies'],
  ['Ball Bearing 6205-2RS','Components'],['Circuit Board Assembly Rev C','Sub-Assemblies'],
  ['Corrugated Shipping Box L','Packaging'],['Hydraulic Cylinder 50mm','Finished Goods'],
  ['Rubber Gasket Seal Kit','Consumables'],['PLC Controller Module X200','Components'],
  ['Conveyor Belt Roller','Sub-Assemblies'],['Powder Coat Paint – Matte Black','Consumables'],
  ['Stainless Steel Rod 12mm','Raw Materials'],['Wiring Harness Assembly','Sub-Assemblies'],
  ['Pneumatic Valve 1/2in','Components'],['LED Indicator Panel','Components'],
  ['Forklift Hydraulic Pump','Finished Goods'],['Anti-Vibration Mount','Components'],
  ['Precision Gear 20T','Sub-Assemblies'],['Thermal Insulation Sheet','Raw Materials'],
  ['Cable Tie Pack 200ct','Consumables'],['Torque Wrench Calibrated','Finished Goods'],
  ['Safety Guard Panel','Sub-Assemblies'],['Weld Wire Spool ER70S','Raw Materials'],
];

function seedRand(seed){ let s = seed; return ()=>{ s = (s*9301+49297)%233280; return s/233280; }; }

const products = NAMES.map((n,i)=>{
  const rnd = seedRand(i*17+3);
  const category = n[1];
  const warehouse = WAREHOUSES[i % WAREHOUSES.length];
  const supplier = SUPPLIERS[i % SUPPLIERS.length];
  const available = Math.round(20 + rnd()*480);
  const assigned = Math.round(rnd()*Math.min(available,120));
  const reserved = Math.round(rnd()*Math.min(available,60));
  const inTransit = Math.round(rnd()*140);
  const price = +(4 + rnd()*380).toFixed(2);
  const avgDailyUsage = +(0.6 + rnd()*9).toFixed(1);
  const leadTime = [5,7,10,14,18,21][i%6];
  const safetyStock = Math.round(avgDailyUsage*leadTime*0.6)+5;
  const reorderPoint = Math.round(safetyStock + avgDailyUsage*leadTime);

  let status;
  if(available === 0) status = 'Out of Stock';
  else if(reserved > available*0.55) status = 'Reserved';
  else if(inTransit > available*0.9 && available < reorderPoint) status = 'In Transit';
  else if(available < reorderPoint*0.6) status = 'Low Stock';
  else status = 'Healthy';

  // synthetic history (6 periods) for expand panel
  const history = Array.from({length:6},(_,k)=> Math.round(avgDailyUsage*(5+rnd()*4)));
  const purchaseHistory = Array.from({length:3},(_,k)=>({
    date: `2026-0${(k%6)+1}-${10+k*3}`,
    qty: Math.round(reorderPoint*(0.8+rnd()*0.6)),
    supplier, cost: +(price*(reorderPoint*0.5)).toFixed(0)
  }));
  const upcomingPO = rnd() > 0.4 ? [{
    id:'PO-'+(3000+i), qty: Math.round(reorderPoint*1.1), date: `2026-0${(i%9)+1}-${(i*3)%27+2}`, status: rnd()>0.5?'Confirmed':'Pending'
  }] : [];

  // ---- fields matching live production columns ----
  const productType = ['Other','Component','Material','Kit','Consumable'][i%5];
  const trackingType = (i%2===0) ? 'Serialized' : 'Unserialized';
  const poQuantity = rnd() > 0.7 ? Math.round(20+rnd()*80) : 0;
  const sold = Math.round(rnd()*Math.min(available*1.4, 300));
  const maintenance = rnd() > 0.75 ? Math.round(rnd()*20) : 0;
  const itemId = 'ITM-'+(5000+i*3);
  const videoLink = rnd() > 0.82 ? 'https://videos.acme-mfg.com/'+itemId.toLowerCase() : '';
  const binLocation = rnd() > 0.55 ? `${String.fromCharCode(65+(i%6))}-${(i%12)+1}-0${(i%9)+1}` : '';
  const internalDescription = rnd() > 0.5 ? 'Verified against ' + supplier + ' spec sheet, rev ' + (1+i%4) : '';

  // per-site breakdown (splits total available/assigned/sold/maintenance across 1-3 sites)
  const siteCount = 1 + (i%3);
  const siteList = [];
  let remStock = available, remAssigned = assigned, remSold = sold, remMaint = maintenance, remPoQty = poQuantity;
  for(let s=0; s<siteCount; s++){
    const isLast = s===siteCount-1;
    const stockShare = isLast ? remStock : Math.round(remStock*(0.3+rnd()*0.4));
    const assignedShare = isLast ? remAssigned : Math.round(remAssigned*(0.3+rnd()*0.4));
    const soldShare = isLast ? remSold : Math.round(remSold*(0.3+rnd()*0.4));
    const maintShare = isLast ? remMaint : Math.round(remMaint*(0.3+rnd()*0.4));
    const poQtyShare = isLast ? remPoQty : Math.round(remPoQty*(0.3+rnd()*0.4));
    remStock -= stockShare; remAssigned -= assignedShare; remSold -= soldShare; remMaint -= maintShare; remPoQty -= poQtyShare;
    siteList.push({
      site: SITE_CODES[(i+s) % SITE_CODES.length],
      price, poQuantity: poQtyShare, stock: stockShare, assigned: assignedShare, sold: soldShare, maintenance: maintShare,
    });
  }
  // primary site's serial/lot breakdown — the real distinction:
  // Serialized  -> one row per unit, each with stock = 1 (individually barcoded)
  // Unserialized -> a single row holding the full site quantity (one lot/bin barcode)
  if(siteList.length && siteList[0].stock > 0){
    const primary = siteList[0];
    const serials = [];

    if(trackingType==='Serialized'){
      const serialCount = Math.min(primary.stock, 3 + (i%6));
      let remAssigned = primary.assigned, remSold = primary.sold, remMaint = primary.maintenance;
      for(let k=0; k<serialCount; k++){
        const isLast = k===serialCount-1;
        const hasCustomer = isLast && remAssigned>0;
        const assignedShare = hasCustomer ? 1 : 0;
        const soldShare = (k===0 && remSold>0) ? 1 : 0;
        const maintShare = (isLast && remMaint>0) ? 1 : 0;
        remAssigned -= assignedShare; remSold -= soldShare; remMaint -= maintShare;
        serials.push({
          serial: 'T'+p_sku(itemId,k),
          price, customer: hasCustomer ? SUPPLIERS[(i+k)%SUPPLIERS.length].split(' ')[0].toUpperCase()+' ACCT' : '',
          startDate: hasCustomer ? `2026-0${(k%9)+1}-1${k}` : '',
          endDate: hasCustomer && rnd()>0.5 ? `2026-1${(k%2)+1}-0${k+1}` : '',
          status: '',
          stock: 1, assigned: assignedShare, sold: soldShare, maintenance: maintShare,
          manufSerial: rnd()>0.4 ? SERIAL_PREFIX[i%SERIAL_PREFIX.length]+Math.round(1000000+rnd()*8999999) : '',
          added: `2026-0${(k%9)+1}-0${(k%8)+1}`,
          notes: rnd()>0.85 ? 'Inspected on receipt' : '',
          binLocation: binLocation || '',
        });
      }
    } else {
      // Unserialized: a single lot barcode carries the entire site quantity
      serials.push({
        serial: 'T'+p_sku(itemId,0),
        price, customer:'', startDate:'', endDate:'', status:'',
        stock: primary.stock, assigned: primary.assigned, sold: primary.sold, maintenance: primary.maintenance,
        manufSerial: '', added: `2026-0${(i%9)+1}-0${(i%8)+1}`, notes:'', binLocation: binLocation || '',
      });
    }
    primary.serials = serials;
  }

  function p_sku(id, k){ return id.replace('ITM-','') + '-2652' + k; }

  return {
    id:i+1, name:n[0], sku:'SKU-'+(1000+i*7), category, warehouse, site:siteList[0].site, supplier,
    available, assigned, reserved, inTransit, price, status,
    avgDailyUsage, leadTime, safetyStock, reorderPoint, history, purchaseHistory, upcomingPO,
    productType, trackingType, poQuantity, sold, maintenance, itemId, videoLink, binLocation, internalDescription,
    sites: siteList,
  };
});

function attachResizers(tableId){
  const table = document.getElementById(tableId);
  table.querySelectorAll('.resizer').forEach(r=>{
    r.addEventListener('mousedown', e=>{
      e.preventDefault();
      const colIdx = +r.dataset.col;

      const startX = e.clientX; const startW = col.offsetWidth;
      function onMove(ev){ const w = Math.max(60, startW + (ev.clientX-startX)); col.style.width = w+'px'; }
      function onUp(){ document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
      document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onUp);
    });
  });
}

function getInvFiltered(){
  const f = state.inv;
  return products.filter(p=>{
    if(f.search && !(p.name.toLowerCase().includes(f.search.toLowerCase()) || p.sku.toLowerCase().includes(f.search.toLowerCase()) || p.itemId.toLowerCase().includes(f.search.toLowerCase()))) return false;
    if(f.category && p.category!==f.category) return false;
    if(f.site && String(p.site)!==f.site) return false;
    if(f.status && p.status!==f.status) return false;
    if(f.tracking && p.trackingType!==f.tracking) return false;
    return true;
  }).sort((a,b)=>{
    const k = f.sortKey; let av=a[k], bv=b[k];
    if(typeof av==='string'){ av=av.toLowerCase(); bv=bv.toLowerCase(); }
    if(av<bv) return f.sortDir==='asc'?-1:1;
    if(av>bv) return f.sortDir==='asc'?1:-1;
    return 0;
  });
}
function getInvPageItems(){
  const all = getInvFiltered();
  const start = (state.inv.page-1)*state.inv.pageSize;
  return all.slice(start, start+state.inv.pageSize);
}

function renderInvPageNumbers(totalFiltered){
  const totalPages = Math.max(1, Math.ceil(totalFiltered/state.inv.pageSize));
  const cur = Math.min(state.inv.page, totalPages);
  const wrap = document.getElementById('invPgNumbers');

  // build page list with ellipsis: first, last, current +-1
  const pages = [];
  const add = n=> { if(!pages.includes(n)) pages.push(n); };
  add(1); add(totalPages);
  add(cur); add(cur-1); add(cur+1);
  const clean = pages.filter(n=>n>=1 && n<=totalPages).sort((a,b)=>a-b);

  let html = '';
  let prev = 0;
  clean.forEach(n=>{
    if(prev && n-prev>1) html += `<span class="pg-ellipsis">…</span>`;
    html += `<button class="${n===cur?'active':''}" data-page="${n}">${n}</button>`;
    prev = n;
  });
  wrap.innerHTML = html;
  wrap.querySelectorAll('[data-page]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.inv.page = +btn.dataset.page; renderInvBody(); });
  });
}

/* ============================================================
   FORECASTING TABLE
============================================================ */
const fcColumns = [
  {key:'name', label:'Product'},
  {key:'sku', label:'SKU'},
  {key:'available', label:'Current Stock'},
  {key:'avgDailyUsage', label:'Avg Daily Usage'},
  {key:'forecastDemand', label:'Forecast Demand'},
  {key:'projectedStock', label:'Projected Stock'},
  {key:'safetyStock', label:'Safety Stock'},
  {key:'reorderPoint', label:'Reorder Point'},
  {key:'recQty', label:'Recommended Qty'},
  {key:'supplier', label:'Supplier'},
  {key:'leadTime', label:'Lead Time'},
  {key:'shortageDate', label:'Expected Shortage Date'},
  {key:'fStatus', label:'Status'},
];

function computeForecast(p, period){
  const forecastDemand = Math.round(p.avgDailyUsage*period);
  const projectedStock = p.available + p.inTransit - forecastDemand;
  let fStatus;
  if(projectedStock<=0) fStatus='Stockout Predicted';
  else if(projectedStock<p.safetyStock) fStatus='Critical';
  else if(projectedStock<p.reorderPoint) fStatus='Low';
  else fStatus='Healthy';
  const recQty = projectedStock<p.reorderPoint ? Math.max(0, Math.round((p.reorderPoint*1.4)+forecastDemand-projectedStock)) : 0;
  const daysLeft = p.avgDailyUsage>0 ? (p.available/p.avgDailyUsage) : 999;
  let shortageDate = '—';
  if(daysLeft < period){
    const d = new Date(2026,6,23); d.setDate(d.getDate()+Math.round(daysLeft));
    shortageDate = d.toLocaleDateString('en-US',{month:'short', day:'numeric', year:'numeric'});
  }
  return {forecastDemand, projectedStock, fStatus, recQty, shortageDate};
}

function getFcFiltered(){
  const f = state.fc;
  return products.filter(p=>{
    if(f.search && !(p.name.toLowerCase().includes(f.search.toLowerCase()) || p.sku.toLowerCase().includes(f.search.toLowerCase()))) return false;
    if(f.supplier && p.supplier!==f.supplier) return false;
    if(f.site && String(p.site)!==f.site) return false;
    if(f.category && p.category!==f.category) return false;
    return true;
  }).map(p=> Object.assign({}, p, computeForecast(p, state.fc.period)));
}

function renderFcHead(){

}

function sparkline(history){
  const max = Math.max(...history, 1);

    return `<div class="bar" style="height:${h}px"><span>P${i+1}</span></div>`;
  }).join('') + `</div>`;
}

function trendSvg(p){
  const pts = p.history.concat([Math.max(1,p.history[p.history.length-1]-p.avgDailyUsage*2)]);
  const max = Math.max(...pts); const w=180,h=44;
  const step = w/(pts.length-1);
  const path = pts.map((v,i)=> `${i===0?'M':'L'} ${(i*step).toFixed(1)} ${(h-(v/max)*h).toFixed(1)}`).join(' ');
  return `<svg width="100%" height="52" viewBox="0 0 ${w} ${h+8}" preserveAspectRatio="none" style="overflow:visible">
    <path d="${path}" fill="none" stroke="var(--info)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    ${pts.map((v,i)=>`<circle cx="${(i*step).toFixed(1)}" cy="${(h-(v/max)*h).toFixed(1)}" r="2.2" fill="var(--info)"/>`).join('')}
  </svg>`;
}

function renderFcSummary(){
  const period = state.fc.period;
  const computed = products.map(p=> Object.assign({}, p, computeForecast(p, period)));
  const total = computed.length;
  const needReorder = computed.filter(p=>p.recQty>0).length;
  const critical = computed.filter(p=>p.fStatus==='Critical'||p.fStatus==='Stockout Predicted').length;
  const coverageDays = Math.round(computed.reduce((a,p)=> a + (p.avgDailyUsage>0?p.available/p.avgDailyUsage:0),0)/total);
  const purchaseValue = computed.reduce((a,p)=> a + p.recQty*p.price, 0);
  const upcomingShort = computed.filter(p=>p.shortageDate!=='—').length;

  const cards = [
    {label:'Products Forecasted', value:total, sub:`Across ${CATEGORIES.length} categories`, icon:ic.box, color:'var(--primary)', bg:'var(--primary-50)'},
    {label:'Items Requiring Reorder', value:needReorder, sub:`${Math.round(needReorder/total*100)}% of catalog`, icon:ic.po, color:'var(--warning)', bg:'var(--warning-soft)'},
    {label:'Critical Stock', value:critical, sub:'Below safety stock', icon:ic.bolt, color:'var(--danger)', bg:'var(--danger-soft)'},
    {label:'Inventory Coverage', value:coverageDays+'d', sub:'Avg. days of stock left', icon:ic.history, color:'var(--info)', bg:'var(--info-soft)'},
    {label:'Purchase Value', value:moneyShort(purchaseValue), sub:'Recommended orders', icon:ic.cart, color:'var(--success)', bg:'var(--success-soft)'},
    {label:'Upcoming Shortages', value:upcomingShort, sub:`Within ${period} days`, icon:ic.truck, color:'var(--purple)', bg:'var(--purple-soft)'},
  ];
  document.getElementById('fcSummaryGrid').innerHTML = cards.map(c=>`
    <div class="summary-card">
      <div class="s-top"><span class="s-label">${c.label}</span><span class="s-icon" style="background:${c.bg};color:${c.color}">${c.icon}</span></div>
      <div class="s-value">${c.value}</div>
      <div class="s-sub">${c.sub}</div>
    </div>
  `).join('');
}

/* ============================================================
   CARD VIEW
============================================================ */
function getCardFiltered(){
  const f = state.card;
  let list = products.filter(p=>{
    if(f.search && !(p.name.toLowerCase().includes(f.search.toLowerCase()) || p.sku.toLowerCase().includes(f.search.toLowerCase()))) return false;
    if(f.category && p.category!==f.category) return false;
    if(f.site && String(p.site)!==f.site) return false;
    if(f.status && p.status!==f.status) return false;
    return true;
  });
  const [key,dir] = f.sort.split('-');
  list.sort((a,b)=>{
    let av = key==='name'?a.name.toLowerCase():(key==='stock'?a.available:a.price);
    let bv = key==='name'?b.name.toLowerCase():(key==='stock'?b.available:b.price);
    if(av<bv) return dir==='asc'?-1:1; if(av>bv) return dir==='asc'?1:-1; return 0;
  });
  return list;
}

function renderCards(){
  const grid = document.getElementById('cardGrid');
  grid.className = 'card-grid' + (state.card.density==='compact' ? ' compact' : '');
  const items = getCardFiltered();
  if(items.length===0){
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">${ic.inbox}<h3>No products found</h3><p>Try adjusting your search or filters.</p></div>`;
    return;
  }
  grid.innerHTML = items.map(p=>{
    const inCart = state.card.cart.has(p.id);
    return `
    <div class="p-card ${inCart?'selected':''}" data-card="${p.id}">
      <div class="p-thumb" style="background:linear-gradient(135deg, ${CAT_COLOR[p.category]}, ${shade(CAT_COLOR[p.category])})">
        <span class="p-status-dot"><span class="dot" style="background:${statusDotColor(p.status)}"></span>${p.status}</span>
        <div class="p-select-check ${inCart?'on':''}" data-cart="${p.id}">${inCart?ic.check:''}</div>
        ${CAT_ICON[p.category]}
      </div>
      <div class="p-body">
        <div class="p-cat">${p.category}</div>
        <div class="p-name">${p.name}</div>
        <div class="p-sku">${p.sku}</div>
        <div class="p-meta"><span>Site ${p.site}</span><span class="stock-val">${p.available.toLocaleString()} in stock</span></div>
        <div class="p-foot">
          <span class="p-price">${money(p.price)}</span>
          <button class="p-add-btn ${inCart?'added':''}" data-cart="${p.id}">
            ${inCart? ic.check+' Added' : '<svg width="13" height="13" viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'currentColor\' stroke-width=\'2.2\'><path d=\'M12 5v14M5 12h14\'/></svg> Add to Cart'}
          </button>
        </div>
      </div>
    </div>`;
  }).join('');

  grid.querySelectorAll('[data-cart]').forEach(el=>{
    el.addEventListener('click', e=>{
      e.stopPropagation();
      const id = +el.dataset.cart;
      state.card.cart.has(id) ? state.card.cart.delete(id) : state.card.cart.add(id);
      renderCards(); updateCartUI();
    });
  });
}
function shade(hex){ return hex+'CC'; }
function statusDotColor(status){
  return {'Healthy':'#15803D','Low Stock':'#B45309','Out of Stock':'#C22A2A','Reserved':'#6D28D9','In Transit':'#0E7490'}[status];
}

function updateCartUI(){
  const n = state.card.cart.size;
  document.getElementById('cartBadge').textContent = n;
  document.getElementById('cartBtn').classList.toggle('has-items', n>0);
  const total = [...state.card.cart].reduce((a,id)=> a + products.find(p=>p.id===id).price, 0);
  document.getElementById('cfCount').textContent = n;
  document.getElementById('cfTotal').textContent = moneyShort(total);
  document.getElementById('cartFloater').classList.toggle('show', n>0);
}

/* ============================================================
   TOAST
============================================================ */
function toast(msg){
  let t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = `position:fixed; top:18px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:10px 18px; border-radius:9px; font-size:12.5px; font-weight:600; z-index:100; box-shadow:var(--shadow-lg);
    opacity:0; transition:opacity .2s;`;
  document.body.appendChild(t);
  requestAnimationFrame(()=> t.style.opacity='1');
  setTimeout(()=>{ t.style.opacity='0'; setTimeout(()=>t.remove(),200); }, 2200);
}
